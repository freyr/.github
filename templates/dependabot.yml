# Copy to .github/dependabot.yml and add the package ecosystem of the repo.
# The commit prefixes keep the PR titles valid for the pr-title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
